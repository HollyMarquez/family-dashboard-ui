<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Marquez Manor</mat-card-title>
      <mat-card-subtitle>Family Dashboard</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mat-tab-group>
        <mat-tab label="Sign In">
          <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="form">
            <mat-form-field appearance="outline">
              <mat-label>Email</mat-label>
              <input matInput type="email" formControlName="email" autocomplete="email" />
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>Password</mat-label>
              <input matInput type="password" formControlName="password" autocomplete="current-password" />
            </mat-form-field>

            @if (error()) {
              <p class="error-msg">{{ error() }}</p>
            }

            <button mat-flat-button color="primary" type="submit" [disabled]="loading() || loginForm.invalid">
              @if (loading()) {
                <mat-spinner diameter="20" />
              } @else {
                Sign In
              }
            </button>
          </form>
        </mat-tab>

        <mat-tab label="Create Account">
          <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="form">
            <mat-form-field appearance="outline">
              <mat-label>Your Name</mat-label>
              <input matInput formControlName="display_name" autocomplete="name" />
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>Email</mat-label>
              <input matInput type="email" formControlName="email" autocomplete="email" />
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>Password</mat-label>
              <input matInput type="password" formControlName="password" autocomplete="new-password" />
              <mat-hint>At least 8 characters</mat-hint>
            </mat-form-field>

            @if (error()) {
              <p class="error-msg">{{ error() }}</p>
            }

            <button mat-flat-button color="primary" type="submit" [disabled]="loading() || registerForm.invalid">
              @if (loading()) {
                <mat-spinner diameter="20" />
              } @else {
                Create Account
              }
            </button>
          </form>
        </mat-tab>
      </mat-tab-group>
    </mat-card-content>
  </mat-card>
</div>
